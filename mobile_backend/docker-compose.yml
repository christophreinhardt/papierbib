services:
  papierbib-api:
    build: .
    image: papierbib-mobile:0.4.1
    container_name: papierbib-api
    restart: unless-stopped
    environment:
      PAPIERBIB_PASSWORD: ${PAPIERBIB_PASSWORD:?Passwort mit mindestens 16 Zeichen setzen}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?HTTPS-Basisadresse der neuen App setzen}
      DATABASE_PATH: /data/papierbib.sqlite3
      MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-20971520}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-gpt-4o-mini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_VISION_MODEL: ${GEMINI_VISION_MODEL:-gemini-2.0-flash}
    ports:
      - "${HOST_BIND:-127.0.0.1}:8888:8080"
    volumes:
      - papierbib_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 100
    init: true
volumes:
  papierbib_data:
